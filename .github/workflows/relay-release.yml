name: Temporary existing-release relay
on:
  push:
    branches: [arena/149c1a8a-getanny]
permissions:
  contents: write
jobs:
  relay:
    if: ${{ !contains(github.event.head_commit.message, 'relay blob manifest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Download existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v2.3.0 --repo p4yy/GetANNY --pattern GetANNY-2.3.0-Setup.exe
      - name: Verify published checksum and size
        env:
          EXPECTED_SHA256: e4cd7bd7c3338029210b92ff9f67f6a298162e4e5b9cd20daee96e5bccefb6b8
          EXPECTED_SIZE: "205823542"
        run: |
          file=GetANNY-2.3.0-Setup.exe
          test "$(stat -c %s "$file")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $file" | sha256sum --check --strict
      - name: Expose bounded chunks through temporary Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: e4cd7bd7c3338029210b92ff9f67f6a298162e4e5b9cd20daee96e5bccefb6b8
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path

          source = Path("GetANNY-2.3.0-Setup.exe")
          repository = os.environ["GITHUB_REPOSITORY"]
          endpoint = f"https://api.github.com/repos/{repository}/git/blobs"
          chunks = []
          chunk_size = 8 * 1024 * 1024
          with source.open("rb") as stream:
              index = 0
              while data := stream.read(chunk_size):
                  request = urllib.request.Request(
                      endpoint,
                      data=json.dumps({
                          "content": base64.b64encode(data).decode("ascii"),
                          "encoding": "base64",
                      }).encode(),
                      method="POST",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                          "Content-Type": "application/json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=180) as response:
                      result = json.load(response)
                  chunks.append({
                      "index": index,
                      "gitBlob": result["sha"],
                      "bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })
                  print(f"Relayed chunk {index + 1}: {len(data)} bytes")
                  index += 1
          manifest = {
              "schemaVersion": 1,
              "source": "https://github.com/p4yy/GetANNY/releases/tag/v2.3.0",
              "filename": source.name,
              "bytes": source.stat().st_size,
              "sha256": os.environ["EXPECTED_SHA256"],
              "chunks": chunks,
          }
          Path("relay-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Publish only the small temporary relay manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add relay-manifest.json
          git commit -m 'GetANNY-Publish-NoTests: relay blob manifest'
          git push
